version: 2

project_name: poomsae

changelog:
  disable: true

release:
  mode: append
  prerelease: auto

before:
  hooks:
    - make web-release-check

builds:
  - id: poomsae
    main: ./cmd/poomsae
    binary: poomsae
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/ifigueroap/poomsae/internal/version.Version=v{{ .Version }}
      - -X github.com/ifigueroap/poomsae/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/ifigueroap/poomsae/internal/version.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: poomsae
    ids:
      - poomsae
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
