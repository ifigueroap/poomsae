name: Released commands

on:
  workflow_call:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-commands:
    name: Released commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false

      - name: Check installer scripts
        run: |
          bash -n scripts/install.sh
          grep -q 'ifigueroap/poomsae' scripts/install.sh
          grep -q 'ifigueroap/poomsae' scripts/install.ps1
          grep -q '${BINARY_NAME}_${version#v}_${platform}.tar.gz' scripts/install.sh
