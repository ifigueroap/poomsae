  /api/v1/projects/{project_id}/search:
    get:
      description: Explicit semantic/hybrid modes return a validation error (400) when a configured embedding credential source is unusable or the provider rejects authentication or access. Default search returns lexical results with degraded_reason instead. Transient vector failures return unavailable (503) in explicit modes.
      operationId: searchIssues
      parameters:
        - description: Continuation for explicit lexical search with sort=oldest
          explode: false
          in: query
          name: cursor
          schema:
            description: Continuation for explicit lexical search with sort=oldest
            type: string
        - description: oldest selects exhaustive creation-ordered lexical pages; omit for relevance ranking
          explode: false
          in: query
          name: sort
          schema:
            description: oldest selects exhaustive creation-ordered lexical pages; omit for relevance ranking
            enum:
              - oldest
              - ""
            type: string
        - description: Issue status; omit to search open and closed issues
          explode: false
          in: query
          name: status
          schema:
            description: Issue status; omit to search open and closed issues
            enum:
              - open
              - closed
            type: string
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: q
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: include_deleted
          schema:
            type: boolean
        - explode: false
          in: query
          name: mode
          schema:
            enum:
              - auto
              - lexical
              - hybrid
              - semantic
            type: string
        - explode: true
          in: query
          name: label
          schema:
            items:
              type: string
            type: array
        - explode: true
          in: query
          name: exclude_label
          schema:
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseBody"
          description: OK
          headers:
            X-Poomsae-Embeddings-Configured:
              schema:
                description: Whether the daemon has an embeddings provider configured.
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Service Unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
