        reply_kind:
          type: string
        reply_to_uid:
          type: string
        source_actor:
          type: string
        teammate:
          type: string
        uid:
          type: string
        verification:
          enum:
            - verified
            - pending
            - legacy
          type: string
      required:
        - id
        - uid
        - issue_id
        - author
        - body
        - created_at
      type: object
    CommentRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        body:
          type: string
        force:
          type: boolean
        kind:
          description: reply is a general response; confirm asserts verification or reproduction
          enum:
            - reply
            - confirm
            - refute
            - supersede
          type: string
        reply_to:
          type: string
        teammate:
          type: string
      required:
        - body
      type: object
    CommentResponseBody:
      properties:
        changed:
