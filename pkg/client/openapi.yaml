        - updated_at
      type: object
    UIIssueReference:
      properties:
        project_name:
          type: string
        project_uid:
          type: string
        qualified_id:
          type: string
        short_id:
          type: string
        status:
          type: string
        title:
          type: string
        uid:
          type: string
      required:
        - uid
        - project_uid
        - project_name
        - short_id
        - qualified_id
        - title
        - status
      type: object
    UIIssueReferenceResponseBody:
      properties:
        issue:
          $ref: "#/components/schemas/IssueStruct"
        scope_project_uid:
          type: string
      required:
        - issue
      type: object
    UILaunchTargetResponseBody:
      properties:
        available:
          type: boolean
        reason:
          enum:
            - browser_origin_unavailable
          type: string
        url:
          format: uri
          type: string
      required:
        - available
      type: object
    UILink:
      properties:
        author:
          type: string
        created_at:
          format: date-time
          type: string
        from_issue_id:
          format: int64
          type: integer
        from_issue_uid:
          type: string
        from_qualified_id:
          type: string
        from_status:
          description: Current status of the from_issue_uid issue.
          type: string
        id:
          format: int64
          type: integer
        to_issue_id:
          format: int64
          type: integer
        to_issue_uid:
          type: string
        to_qualified_id:
          type: string
        to_status:
          description: Current status of the to_issue_uid issue.
          type: string
        type:
          type: string
      required:
        - from_qualified_id
        - from_status
        - to_qualified_id
        - to_status
        - id
        - from_issue_id
        - from_issue_uid
        - to_issue_id
        - to_issue_uid
        - type
        - author
        - created_at
      type: object
    UIProject:
      properties:
        project:
          $ref: "#/components/schemas/ProjectOut"
        stats:
          $ref: "#/components/schemas/ProjectStats"
      required:
        - project
      type: object
    UIReferencesResponseBody:
      properties:
        capabilities:
          $ref: "#/components/schemas/UICapabilities"
        contract_version:
          type: string
        cursor:
          format: int64
          type: integer
        issues:
          items:
            $ref: "#/components/schemas/UIIssueReference"
          type: array
        labels:
          items:
            type: string
          type: array
        origin:
          type: string
        origin_stable:
          type: boolean
        owners:
          items:
            type: string
          type: array
        projects:
          items:
            $ref: "#/components/schemas/ProjectOut"
          type: array
      required:
        - contract_version
        - cursor
        - capabilities
        - origin
        - origin_stable
        - projects
        - issues
        - owners
        - labels
      type: object
    UISelectedAuthority:
      properties:
        comments:
          items:
            $ref: "#/components/schemas/CommentOut"
          type: array
        effective_close_event:
          $ref: "#/components/schemas/Event"
        history:
          items:
            $ref: "#/components/schemas/Event"
          type: array
        issue:
          $ref: "#/components/schemas/UIIssue"
        labels:
          items:
            $ref: "#/components/schemas/IssueLabel"
          type: array
        links:
          items:
            $ref: "#/components/schemas/UILink"
          type: array
        recurrences:
          items:
            $ref: "#/components/schemas/Recurrence"
          type: array
        state:
          type: string
      required:
        - state
        - comments
        - labels
        - links
        - recurrences
        - history
      type: object
    UISnapshotResponseBody:
      properties:
        capabilities:
          $ref: "#/components/schemas/UICapabilities"
        catalog:
          items:
            $ref: "#/components/schemas/UIProject"
          type: array
        collection:
          items:
            $ref: "#/components/schemas/UIIssue"
          type: array
        collection_links:
          description: "Every link between two issues the principal can read (non-deleted issues in non-archived projects) that has at least one endpoint in collection, regardless of the collection's view, project_uid, status, owner, label, relationship, text, local_date, time_zone, or limit parameters. Count parent links whose to_issue_uid is a collection issue to get its children: from_status gives each child's status, and the open and total counts equal child_counts from GET /api/v1/issues for the same principal at the same cursor (an absent child_counts means zero)."
          items:
            $ref: "#/components/schemas/UILink"
          type: array
        contract_version:
          type: string
        cursor:
          format: int64
          type: integer
        graph:
          $ref: "#/components/schemas/UIGraph"
        origin:
          type: string
        origin_stable:
          type: boolean
        selected:
          $ref: "#/components/schemas/UISelectedAuthority"
      required:
        - contract_version
        - cursor
        - capabilities
        - origin
        - origin_stable
        - catalog
        - collection
        - collection_links
      type: object
    UnassignRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        expected_owner:
          type: string
      type: object
info:
  title: poomsae
  version: 0.71.0
openapi: 3.0.3
paths:
  /api/v1/audit/closes:
    get:
      operationId: auditCloses
      parameters:
        - explode: false
          in: query
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
        - description: "RFC3339 timestamp (default: zero time)"
          explode: false
          in: query
          name: since
          schema:
            description: "RFC3339 timestamp (default: zero time)"
            type: string
        - description: "RFC3339 timestamp (default: now)"
          explode: false
          in: query
          name: until
          schema:
            description: "RFC3339 timestamp (default: now)"
            type: string
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - description: filter to closes of children of parent <ref>
          explode: false
          in: query
          name: parent
          schema:
            description: filter to closes of children of parent <ref>
            type: string
        - explode: false
          in: query
          name: reason
          schema:
            type: string
        - explode: false
          in: query
          name: no_evidence
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditClosesResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/digest:
    get:
      operationId: digestGlobal
      parameters:
        - explode: false
          in: query
          name: since
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: until
          schema:
            type: string
        - explode: true
          in: query
          name: actor
          schema:
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/docbank/probe:
    get:
      operationId: probeDocbank
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocbankProbe"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Service Unavailable
      summary: Check that the daemon reaches Docbank and Docbank accepts its key
  /api/v1/doctor:
    get:
      operationId: doctor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/embeddings/local:
    get:
      operationId: getLocalEmbeddings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalEmbeddingsStatus"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
    post:
      operationId: turnOnLocalEmbeddings
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalEmbeddingsStatus"
          description: Accepted
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
  /api/v1/embeddings/local/restart:
    post:
      operationId: restartLocalEmbeddings
      responses:
        "202":
          description: Accepted
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
  /api/v1/events:
    get:
      operationId: pollEvents
      parameters:
        - explode: false
          in: query
          name: after_id
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollEventsBody"
          description: OK
          headers:
            X-Poomsae-Event-Features:
              schema:
                type: string
            X-Poomsae-Events-Issue-UID:
              schema:
                description: Resolved subject UID when the issue filter is applied, including empty pages.
                type: string
            X-Poomsae-Required-Event-Features:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/events/stream:
    get:
      description: Streams durable events as Server-Sent Events. Clients may resume with Last-Event-ID or after_id, but not both.
      operationId: streamEvents
      parameters:
        - description: Exclusive event cursor. Mutually exclusive with Last-Event-ID.
          in: query
          name: after_id
          schema:
            format: int64
            type: integer
        - description: Optional project ID filter. Omit to stream all visible project events.
          in: query
          name: project_id
          schema:
            format: int64
            type: integer
        - description: Exclusive resume cursor from the last received SSE id. Mutually exclusive with after_id.
          in: header
          name: Last-Event-ID
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: UTF-8 Server-Sent Events frames containing event envelopes or sync.reset_required reset payloads.
                type: string
          description: Server-Sent Events stream.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      summary: Stream events
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/instance:
    get:
      operationId: instance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/issues:
    get:
      operationId: listAllIssues
      parameters:
        - description: Restrict to these positive project IDs; mutually exclusive with project_id
          explode: true
          in: query
          name: project_ids
          schema:
            description: Restrict to these positive project IDs; mutually exclusive with project_id
            items:
              format: int64
              type: integer
            type: array
        - description: Opaque next_cursor from a matching stable-order page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque next_cursor from a matching stable-order page
            type: string
        - description: Count all matching issues, ignoring cursor and limit
          explode: false
          in: query
          name: include_total
          schema:
            description: Count all matching issues, ignoring cursor and limit
            type: boolean
        - description: Leave out issue bodies and keep only the metadata keys meta filters name, so a large issue cannot make the page too large to read
          explode: false
          in: query
          name: compact
          schema:
            description: Leave out issue bodies and keep only the metadata keys meta filters name, so a large issue cannot make the page too large to read
            type: boolean
        - explode: false
          in: query
          name: project_id
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - open
              - closed
              - ""
            type: string
        - description: exact priority filter (0..4 or none for unset); empty = no filter
          explode: false
          in: query
          name: priority
          schema:
            description: exact priority filter (0..4 or none for unset); empty = no filter
            type: string
        - description: include only priority <= this value (0..4), excluding unset; empty = no filter
          explode: false
          in: query
          name: max_priority
          schema:
            description: include only priority <= this value (0..4), excluding unset; empty = no filter
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - description: oldest = creation ascending; created = creation descending; both use id as tie-breaker; empty preserves the route default
          explode: false
          in: query
          name: sort
          schema:
            description: oldest = creation ascending; created = creation descending; both use id as tie-breaker; empty preserves the route default
            enum:
              - oldest
              - created
              - ""
            type: string
        - explode: false
          in: query
          name: unowned
          schema:
            type: boolean
        - explode: false
          in: query
          name: owner
          schema:
            type: string
        - explode: true
          in: query
          name: label
          schema:
            items:
              type: string
            type: array
        - explode: true
          in: query
          name: exclude_label
          schema:
            items:
              type: string
            type: array
        - explode: true
          in: query
          name: meta
          schema:
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAllIssuesResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/issues/{uid}:
    get:
      operationId: showIssueByUID
      parameters:
        - explode: false
          in: query
          name: thread
          schema:
            type: string
        - explode: false
          in: query
          name: inbound
          schema:
            type: string
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - reply
              - confirm
              - refute
              - supersede
            type: string
        - explode: false
          in: query
          name: since
          schema:
            type: string
        - in: path
          name: uid
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: include_deleted
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowIssueResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/mcp-events/list:
    post:
      operationId: mcpEventsList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEventsListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      summary: List the MCP Events this daemon can deliver
  /api/v1/mcp-events/subscribe:
    post:
      operationId: mcpEventsSubscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPEventsSubscribeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEventsSubscribeResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      summary: Create or refresh an MCP Events webhook subscription
  /api/v1/mcp-events/subscriptions:
    get:
      operationId: mcpEventSubscriptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEventsSubscriptionsResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      summary: List the caller's MCP Events subscriptions and whether Events is running
  /api/v1/mcp-events/unsubscribe:
    post:
      operationId: mcpEventsUnsubscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPEventsUnsubscribeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEventsUnsubscribeResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      summary: End an MCP Events webhook subscription
  /api/v1/ping:
    get:
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - explode: false
          in: query
          name: include
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
    post:
      operationId: initProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitProjectRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitProjectResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/projects/resolve:
    get:
      operationId: readProjectByName
      parameters:
        - description: project name
          explode: false
          in: query
          name: name
          required: true
          schema:
            description: project name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResolveBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
    post:
      operationId: resolveProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveProjectRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResolveBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/projects/{project_id}:
    delete:
      operationId: removeProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: actor
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: force
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveProjectResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
    get:
      operationId: showProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowProjectResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
    patch:
      operationId: renameProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameProjectRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowProjectResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/projects/{project_id}/actions/purge:
    post:
      operationId: purgeProject
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
        - in: header
          name: X-Poomsae-Confirm
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPurgeRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPurgeResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/projects/{project_id}/actions/rewrite-author:
    post:
      operationId: rewriteAuthorIdentity
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteAuthorIdentityRequestBody"
        required: true
      responses:
        "200":
          content:
