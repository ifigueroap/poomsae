components:
  schemas:
    Action:
      additionalProperties: false
      properties:
        kind:
          type: string
        message:
          type: string
        prompt:
          type: string
        recipient:
          type: string
        workflow_uid:
          type: string
      required:
        - kind
      type: object
    ActionRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        dry_run:
          type: boolean
        evidence:
          items:
            $ref: "#/components/schemas/Evidence"
          type: array
        message:
          type: string
        reason:
          enum:
            - done
            - wontfix
            - duplicate
            - superseded
            - audit-no-change
            - ""
          type: string
        source:
          enum:
            - tui
            - ""
          type: string
      type: object
    ActionResponse:
      properties:
        kind:
          type: string
        message:
          type: string
        prompt:
          type: string
        recipient:
          type: string
        workflow_uid:
          type: string
      required:
        - kind
      type: object
    AddAttachmentResponseBody:
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
        attachment_id:
          type: string
      required:
        - attachment_id
        - attachment
      type: object
    AddLabelRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        label:
          type: string
      required:
        - label
      type: object
    AddLabelResponseBody:
      properties:
        changed:
          type: boolean
        event:
          $ref: "#/components/schemas/Event"
        issue:
          $ref: "#/components/schemas/Issue"
        label:
          $ref: "#/components/schemas/IssueLabel"
      required:
        - issue
        - label
        - event
        - changed
      type: object
    AliasInput:
      additionalProperties: false
      properties:
        identity:
          description: alias identity (normalized git remote or local://<abs>)
          type: string
        kind:
          description: "\"git\" or \"local\""
          type: string
      required:
        - identity
        - kind
      type: object
    AssignRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        owner:
          type: string
      required:
        - owner
      type: object
    Attachment:
      properties:
        docbank_version:
          format: uuid
          type: string
        media_type:
          type: string
        name:
          type: string
        origin:
          type: string
        size:
          format: int64
          type: integer
      required:
        - name
        - media_type
        - size
        - docbank_version
      type: object
    AuditCloseRow:
      properties:
        actor:
          type: string
        event_id:
          format: int64
          type: integer
        evidence_types:
          items:
            type: string
          type: array
        flags:
          items:
            type: string
          type: array
        issue:
          type: string
        message:
          type: string
        parent:
          type: string
        parent_uid:
          type: string
        reason:
          type: string
        time:
          type: string
      required:
        - time
        - actor
        - issue
        - reason
        - event_id
      type: object
    AuditClosesResponseBody:
      properties:
        rows:
          items:
            $ref: "#/components/schemas/AuditCloseRow"
          type: array
      required:
        - rows
      type: object
    AuthInfoOut:
      properties:
        actor:
          type: string
        allowed_actions:
          items:
            type: string
          type: array
        close_requires_evidence:
          type: boolean
        expires_at:
          format: date-time
          type: string
        kind:
          type: string
        scope:
          $ref: "#/components/schemas/TokenScopeOut"
        token_audit_read:
          type: boolean
      required:
        - kind
      type: object
    CaptureTelemetryEventRequestBody:
      additionalProperties: false
      properties:
        event:
          minLength: 1
          type: string
        properties:
          additionalProperties: true
          type: object
      required:
        - event
      type: object
    CaptureTelemetryEventResponseBody:
      properties:
        status:
          enum:
            - queued
            - disabled
            - full
          type: string
      required:
        - status
      type: object
    ChildCounts:
      properties:
        open:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - open
        - total
      type: object
    ClaimActionBody:
      additionalProperties: true
      properties:
        actor:
          type: string
        claim_kind:
          type: string
        client_kind:
          type: string
        holder:
          type: string
        purpose:
          type: string
        reason:
          type: string
        ttl_seconds:
          format: int64
          type: integer
      type: object
    ClaimActionResponseBody:
      properties:
        claim:
          $ref: "#/components/schemas/IssueClaimOut"
        event:
          $ref: "#/components/schemas/Event"
        granted:
          type: boolean
        holder:
          $ref: "#/components/schemas/ClaimPrincipalOut"
        lease:
          $ref: "#/components/schemas/IssueClaimOut"
        pending:
          type: boolean
        request_uid:
          type: string
      required:
        - granted
        - holder
      type: object
    ClaimPrincipalOut:
      properties:
        client_kind:
          type: string
        holder:
          type: string
        holder_instance_uid:
          type: string
      required:
        - holder_instance_uid
        - holder
        - client_kind
      type: object
    ClaimRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        force:
          type: boolean
        if_unowned:
          type: boolean
        ttl_seconds:
          format: int64
          maximum: 86400
          minimum: 60
          type: integer
      type: object
    ClaimResponseBody:
      properties:
        changed:
          type: boolean
        event:
          $ref: "#/components/schemas/Event"
        events:
          items:
            $ref: "#/components/schemas/Event"
          type: array
        issue:
          $ref: "#/components/schemas/Issue"
        previous_owner:
          type: string
        replay_events:
          items:
            $ref: "#/components/schemas/Event"
          type: array
      required:
        - issue
        - events
        - changed
      type: object
    ClaimStatusBody:
      properties:
        claim:
          $ref: "#/components/schemas/IssueClaimOut"
        held:
          type: boolean
        holder:
          $ref: "#/components/schemas/ClaimPrincipalOut"
        hub_now:
          format: date-time
          type: string
        lease:
          $ref: "#/components/schemas/IssueClaimOut"
      required:
        - held
        - holder
        - hub_now
      type: object
    ClaimViolationOut:
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        event_id:
          format: int64
          type: integer
        event_uid:
          type: string
        issue_uid:
          type: string
        offending_event_type:
          type: string
        offending_event_uid:
          type: string
        offending_origin_instance_uid:
          type: string
        reason:
          type: string
        short_id:
          type: string
      required:
        - event_id
        - event_uid
        - issue_uid
        - at
      type: object
    CloseActionRequestBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        dry_run:
          type: boolean
        evidence:
          items:
            $ref: "#/components/schemas/Evidence"
          type: array
        message:
          type: string
        reason:
          enum:
            - done
            - wontfix
            - duplicate
            - superseded
            - audit-no-change
            - ""
          type: string
        retry_protocol:
          enum:
            - close-v1
            - ""
          type: string
        source:
          enum:
            - tui
            - ""
          type: string
        transcript:
          $ref: "#/components/schemas/Transcript"
        transcript_selection:
          $ref: "#/components/schemas/TranscriptSelection"
      type: object
    Comment:
      properties:
        accountable_actor:
          type: string
        author:
          type: string
        authority_uid:
          type: string
        body:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        issue_id:
          format: int64
          type: integer
        reply_kind:
          type: string
        reply_to_uid:
          type: string
        source_actor:
          type: string
        teammate:
          type: string
        uid:
          type: string
        verification:
          enum:
            - verified
            - pending
            - legacy
          type: string
      required:
        - id
        - uid
        - issue_id
        - author
        - body
        - created_at
      type: object
    CommentLink:
      properties:
        author:
          type: string
        body:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type: string
        handle:
          type: string
        issue_short_id:
          type: string
        issue_uid:
          type: string
        kind:
          type: string
        project_id:
          format: int64
          type: integer
        project_uid:
          type: string
        status:
          type: string
        target_edited:
          type: boolean
        teammate:
          type: string
        uid:
          type: string
      required:
        - kind
      type: object
    CommentOut:
      properties:
        accountable_actor:
          type: string
        author:
          type: string
        authority_uid:
          type: string
        backlinks:
          items:
            $ref: "#/components/schemas/CommentLink"
          type: array
        backlinks_truncated:
          type: boolean
        body:
          type: string
        created_at:
          format: date-time
          type: string
        edited_at:
          format: date-time
          type: string
        handle:
          type: string
        id:
          format: int64
          type: integer
        issue_id:
          format: int64
          type: integer
        issue_short_id:
          type: string
        issue_uid:
          type: string
        project_id:
          format: int64
          type: integer
        project_name:
          type: string
        project_uid:
          type: string
        reply:
